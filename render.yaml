services:
  - type: web
    name: medicare-hospital-management
    runtime: python
    plan: free
    branch: main

    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput

    startCommand: gunicorn hospital.wsgi:application

    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5

      - key: SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"