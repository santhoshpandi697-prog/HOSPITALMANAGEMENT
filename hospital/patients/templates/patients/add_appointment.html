<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Book Appointment | HMS</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial,sans-serif;
    background: #f3f7fb;
    color: #172b4d;
}

.sidebar {
    position: fixed;
    width: 245px;
    height: 100vh;
    background: linear-gradient(180deg,#16283d,#213b56);
    padding: 28px 16px;
    color: white;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    padding: 0 18px 35px;
}

.logo span {
    color: #4fc3f7;
}

.menu-title {
    font-size: 11px;
    color: #8fa7bd;
    padding: 0 18px 10px;
}

.menu a {
    display: block;
    padding: 14px 18px;
    margin: 6px 0;
    border-radius: 10px;
    color: #dce8f2;
    text-decoration: none;
}

.menu a:hover,
.menu a.active {
    background: #3498db;
    color: white;
}

.main {
    margin-left: 245px;
    padding: 35px;
}

.header,
.card {
    background: white;
    border-radius: 18px;
    box-shadow: 0 8px 25px rgba(20,50,80,.06);
}

.header {
    padding: 28px 30px;
    margin-bottom: 22px;
}

.header h1 {
    margin: 0 0 8px;
}

.header p {
    margin: 0;
    color: #718096;
}

.card {
    max-width: 850px;
    padding: 30px;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.field {
    display: flex;
    flex-direction: column;
}

.full {
    grid-column: 1/-1;
}

label {
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 8px;
}

select,
input {
    padding: 13px;
    border: 1px solid #d9e1e8;
    border-radius: 9px;
    font-size: 14px;
    outline: none;
    background: white;
}

select:focus,
input:focus {
    border-color: #3498db;
}

.actions {
    margin-top: 25px;
    display: flex;
    gap: 12px;
}

.book {
    border: none;
    background: #27ae60;
    color: white;
    padding: 13px 22px;
    border-radius: 8px;
    font-weight: bold;
    cursor: pointer;
}

.cancel {
    text-decoration: none;
    background: #edf2f7;
    color: #475569;
    padding: 13px 22px;
    border-radius: 8px;
}

</style>

</head>

<body>

<div class="sidebar">

    <div class="logo">
        🏥 HMS<span>.</span>
    </div>

    <div class="menu-title">
        Main Menu
    </div>

    <div class="menu">

        <a href="{% url 'dashboard' %}">
            🏠 Dashboard
        </a>

        <a href="{% url 'patient_list' %}">
            👥 Patients
        </a>

        <a href="{% url 'doctor_list' %}">
            🩺 Doctors
        </a>

        <a href="{% url 'appointment_list' %}" class="active">
            📅 Appointments
        </a>

        <a href="/admin/">
            ⚙️ Administration
        </a>

    </div>

</div>


<div class="main">

    <div class="header">

        <h1>Book New Appointment</h1>

        <p>
            Schedule an appointment between a patient and doctor.
        </p>

    </div>


    <div class="card">

        <form method="POST">

            {% csrf_token %}

            <div class="grid">


                <div class="field">

                    <label>Select Patient</label>

                    <select name="patient" required>

                        <option value="">
                            Choose patient
                        </option>

                        {% for patient in patients %}

                        <option value="{{ patient.id }}">
                            {{ patient.name }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="field">

                    <label>Select Doctor</label>

                    <select name="doctor" required>

                        <option value="">
                            Choose doctor
                        </option>

                        {% for doctor in doctors %}

                        <option value="{{ doctor.id }}">
                            Dr. {{ doctor.name }} - {{ doctor.specialization }}
                        </option>

                        {% endfor %}

                    </select>

                </div>


                <div class="field">

                    <label>Appointment Date</label>

                    <input
                        type="date"
                        name="date"
                        required
                    >

                </div>


                <div class="field">

                    <label>Appointment Time</label>

                    <input
                        type="time"
                        name="time"
                        required
                    >

                </div>


                <div class="field full">

                    <label>Status</label>

                    <select name="status">

                        <option value="Scheduled">
                            Scheduled
                        </option>

                        <option value="Completed">
                            Completed
                        </option>

                        <option value="Cancelled">
                            Cancelled
                        </option>

                    </select>

                </div>


            </div>


            <div class="actions">

                <button
                    type="submit"
                    class="book">

                    📅 Book Appointment

                </button>


                <a
                    href="{% url 'appointment_list' %}"
                    class="cancel">

                    Cancel

                </a>

            </div>

        </form>

    </div>

</div>

</body>

</html>
