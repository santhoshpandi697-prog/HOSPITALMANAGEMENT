{% if is_paginated %}<div class="pagination">{% if page_obj.has_previous %}<a href="?page={{ page_obj.previous_page_number }}{% if search %}&search={{ search|urlencode }}{% endif %}{% if gender %}&gender={{ gender|urlencode }}{% endif %}{% if specialization %}&specialization={{ specialization|urlencode }}{% endif %}{% if status %}&status={{ status|urlencode }}{% endif %}">← Previous</a>{% endif %}<span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>{% if page_obj.has_next %}<a href="?page={{ page_obj.next_page_number }}{% if search %}&search={{ search|urlencode }}{% endif %}{% if gender %}&gender={{ gender|urlencode }}{% endif %}{% if specialization %}&specialization={{ specialization|urlencode }}{% endif %}{% if status %}&status={{ status|urlencode }}{% endif %}">Next →</a>{% endif %}</div>{% endif %}
